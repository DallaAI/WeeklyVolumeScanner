name: Run Stock Screener

on:
  schedule:
    # Runs Monday through Friday at 10:30 AM UTC (4:00 PM IST)
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance requests

    - name: Execute Screener
      run: python screener.py

    - name: Commit and Push Results
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "action@github.com"
        git add screener_results.csv || exit 0
        git commit -m "Auto-update volume surge stocks" || exit 0
        git push
